"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
${custom.jj_name}\
${custom.jj_id}\
${custom.jj_status}\
$git_branch\
$git_commit\
$git_status\
$hg_branch\
$pijul_channel\
$fossil_branch\
[](fg:yellow bg:green)\
$buf\
$bun\
$c\
$cpp\
$cmake\
$cobol\
$crystal\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$meson\
$mojo\
$nim\
$nodejs\
$ocaml\
$odin\
$opa\
$package\
$perl\
$php\
$pixi\
$purescript\
$python\
$raku\
$red\
$rlang\
$ruby\
$rust\
$scala\
$solidity\
$spack\
$swift\
$terraform\
$typst\
$vlang\
$xmake\
$zig\
[](fg:green bg:sapphire)\
$aws\
$azure\
$conda\
$container\
$direnv\
$docker_context\
$gcloud\
$guix_shell\
$kubernetes\
$nats\
$netns\
$nix_shell\
$openstack\
$pulumi\
$singularity\
$vagrant\
[](fg:sapphire bg:lavender)\
$battery\
$memory_usage\
$shlvl\
$status\
$sudo\
$time\
$cmd_duration\
[ ](fg:lavender)\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
Bluefin = " "
CachyOS = " "
CentOS = " "
Debian = "󰣚 "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = "󰣛 "
FreeBSD = " "
Garuda = " "
Gentoo = "󰣨 "
HardenedBSD = "󰞌 "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
Linux = "󰌽 "
Mabox = " "
Macos = "󰀵 "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = "󰣭 "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = "󰐿 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = "󰕈 "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = " "
Zorin = " "

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[hostname]
ssh_symbol = " "
style = "fg:crust bg:red"

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"Desktop" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Projects" = "󰲋 "
"Project" = "󰲋 "
"Public" = "󰞉 "
"Templates" = " "
"Videos" = " "

[custom.jj_name]
symbol = "󱗆 "
style = "fg:crust bg:yellow"
format = '[ $symbol$output ]($style)'
when = "jj-starship detect"
command = "jj-starship --no-color --no-symbol --no-jj-prefix --no-git-prefix --no-jj-id --no-jj-status --no-git-id --no-git-status"

[custom.jj_id]
style = "fg:crust bg:yellow"
format = '[ $output ]($style)'
when = "jj-starship detect"
command = "jj-starship --no-color --no-symbol --no-jj-prefix --no-git-prefix --no-jj-name --no-jj-status --no-git-name --no-git-status"

[custom.jj_status]
style = "fg:crust bg:yellow"
format = '[ $output ]($style)'
when = "jj-starship detect"
command = "jj-starship --no-color --no-symbol --no-jj-prefix --no-git-prefix --no-jj-name --no-jj-id --no-git-name --no-git-id"

[git_branch]
symbol = " "
disabled = true
style = "fg:crust bg:yellow"
format = '[ $symbol$branch ]($style)'

[git_commit]
tag_symbol = '  '
disabled = true
style = "fg:crust bg:yellow"
format = '[ $hash$tag ]($style)'

[git_status]
disabled = true
style = "fg:crust bg:yellow"
format = '[($all_status$ahead_behind )]($style)'

[hg_branch]
symbol = " "
disabled = true
style = "fg:crust bg:yellow"
format = '[ $symbol$branch ]($style)'

[pijul_channel]
symbol = " "
disabled = true
style = "fg:crust bg:yellow"
format = '[ $symbol$channel ]($style)'

[fossil_branch]
symbol = " "
disabled = true
style = "fg:crust bg:yellow"
format = '[ $symbol$branch ]($style)'

[buf]
symbol = " "
style = "fg:crust bg:green"

[bun]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[c]
symbol = " "
