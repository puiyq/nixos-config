"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$username\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$vcs\
[](fg:yellow bg:green)\
$buf\
$bun\
$c\
$cpp\
$cmake\
$cobol\
$crystal\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$meson\
$mojo\
$nim\
$nodejs\
$ocaml\
$odin\
$opa\
$package\
$perl\
$php\
$pixi\
$purescript\
$python\
$raku\
$red\
$rlang\
$ruby\
$rust\
$scala\
$solidity\
$spack\
$swift\
$terraform\
$typst\
$vlang\
$xmake\
$zig\
[](fg:green bg:sapphire)\
$aws\
$azure\
$conda\
$container\
$direnv\
$docker_context\
$gcloud\
$guix_shell\
$kubernetes\
$nats\
$netns\
$nix_shell\
$openstack\
$pulumi\
$singularity\
$vagrant\
[](fg:sapphire bg:lavender)\
$battery\
$memory_usage\
$shlvl\
$status\
$sudo\
$time\
$cmd_duration\
[ ](fg:lavender)\
$line_break\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = " "
Amazon = " "
Android = " "
AOSC = " "
Arch = "󰣇 "
Artix = "󰣇 "
Bluefin = " "
CachyOS = " "
CentOS = " "
Debian = "󰣚 "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = "󰣛 "
FreeBSD = " "
Garuda = " "
Gentoo = "󰣨 "
HardenedBSD = "󰞌 "
Illumos = " "
InstantOS = " "
Ios = "󰀷 "
Kali = " "
Linux = "󰌽 "
Mabox = " "
Macos = "󰀵 "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = "󰣭 "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = " "
openEuler = " "
openSUSE = " "
OracleLinux = "󰺡 "
PikaOS = " "
Pop = " "
Raspbian = "󰐿 "
Redhat = "󱄛 "
RedHatEnterprise = "󱄛 "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = "󰕈 "
Ultramarine = " "
Unknown = " "
Uos = " "
Void = " "
Windows = " "
Zorin = " "

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

[hostname]
ssh_symbol = " "
style = "fg:crust bg:red"

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"Desktop" = " "
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Projects" = "󰲋 "
"Public" = "󰞉 "
"Templates" = " "
"Videos" = " "

[vcs]
order = ["jj", "git"]
jj_modules = '[$jj_bookmark$jj_change$jj_metrics$jj_status](fg:crust bg:yellow)'

[jj_bookmark]
style = "fg:crust bg:yellow"

[jj_change]
prefix_style = "fg:crust bg:yellow"
suffix_style = "fg:crust bg:yellow"
change_offset_style = "fg:crust bg:yellow"

[jj_metrics]
added_style = "fg:crust bg:yellow"
deleted_style = "fg:crust bg:yellow"

[jj_status]
style = "fg:crust bg:yellow"

[git_status]
disabled = true
style = "fg:crust bg:yellow"
format = '[$all_status$ahead_behind ]($style)'

[buf]
symbol = " "
style = "fg:crust bg:green"
format = '[with $symbol($version )]($style)'

[bun]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[c]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[cpp]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version(-$name) )]($style)'

[cmake]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[cobol]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[crystal]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[dart]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[deno]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[dotnet]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[elixir]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version \(OTP $otp_version\) )]($style)'

[elm]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[erlang]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[fennel]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[fortran]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[gleam]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[golang]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[gradle]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[haskell]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[haxe]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[helm]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[java]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[julia]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[kotlin]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[lua]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[maven]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[meson]
symbol = "󰔷 "
style = "fg:crust bg:green"
format = '[via $symbol$project]($style)'

[mojo]
symbol = "󰈸 "
style = "fg:crust bg:green"
format = '[with $symbol($version )]($style)'

[nim]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[nodejs]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[ocaml]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[odin]
symbol = "󰟢 "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[opa]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[package]
symbol = "󰏗 "
style = "fg:crust bg:green"
format = '[ $symbol$version ]($style)'

[perl]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[php]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[pixi]
symbol = "󰏗 "
style = "fg:crust bg:green"
format = '[via $symbol($version )(\($environment\) )]($style)'

[purescript]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[python]
symbol = " "
style = "fg:crust bg:green"
format = '[ $symbol($version )(\(#$virtualenv\) )]($style)'

[raku]
symbol = "󱖊 "
style = "fg:crust bg:green"
format = '[via $symbol($version-$vm_version )]($style)'

[red]
symbol = "󱍼 "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[rlang]
symbol = "󰟔 "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[ruby]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[rust]
symbol = "󱘗 "
style = "fg:crust bg:green"
format = '[ $symbol($version )]($style)'

[scala]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[solidity]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[spack]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol$environment]($style)'

[swift]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[terraform]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol$workspace]($style)'

[typst]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[vlang]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[xmake]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[zig]
symbol = " "
style = "fg:crust bg:green"
format = '[via $symbol($version )]($style)'

[aws]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[on $symbol($profile )(\($region\) )(\[$duration\] )]($style)'

[azure]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[on $symbol($subscription)]($style)'

[conda]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[ $symbol$environment ]($style)'
ignore_base = false

[container]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[$symbol\[$name\] ]($style)'

[direnv]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[$symbol$loaded/$allowed ]($style)'

[docker_context]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[ $symbol$context ]($style)'

[gcloud]
symbol = "󱇶 "
style = "fg:crust bg:sapphire"
format = '[on $symbol$account(@$domain)(\($region\))]($style)'

[guix_shell]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[via $symbol]($style)'

[kubernetes]
symbol = "󱃾 "
style = "fg:crust bg:sapphire"
format = '[$symbol$context( \($namespace\)) in ]($style)'

[nats]
symbol = " "
style = "fg:crust bg:sapphire"

[netns]
symbol = "󰛳 "
style = "fg:crust bg:sapphire"

[nix_shell]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[via $symbol$state( \($name\)) ]($style)'

[openstack]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[on $symbol$cloud(\($project\)) ]($style)'

[pulumi]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[via $symbol($username@)$stack ]($style)'

[singularity]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[$symbol\[$env\] ]($style)'

[vagrant]
symbol = " "
style = "fg:crust bg:sapphire"
format = '[via $symbol($version )]($style)'

[battery]
disabled = true
format = '[$symbol$percentage ]($style)'
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[[battery.display]]
threshold = 100
style = "fg:crust bg:lavender"

[memory_usage]
symbol = "󰍛 "
style = "fg:crust bg:lavender"
format = '[via $symbol$ram( | $swap) ]($style)'

[shlvl]
symbol = "󰹍 "
style = "fg:crust bg:lavender"
format = '[$symbol$shlvl ]($style)'

[status]
symbol = " "
style = "fg:crust bg:lavender"
format = '[$symbol$status ]($style)'

[sudo]
symbol = " "
style = "fg:crust bg:lavender"

[time]
disabled = true
time_format = "%R"
style = "fg:crust bg:lavender"
format = '[  $time ]($style)'

[cmd_duration]
show_milliseconds = false
format = "[  $duration ]($style)"
style = "fg:crust bg:lavender"
disabled = false
show_notifications = false
min_time_to_notify = 45000

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_one_symbol = '[❮](bold fg:lavender)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
